name: Stage one People hero

on:
  workflow_dispatch:
    inputs:
      person_id:
        description: TMDB Person ID registered in data/people.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PEOPLE_HERO_PROXY_URL: ${{ vars.PEOPLE_HERO_PROXY_URL }}
      PEOPLE_HERO_PROXY_TOKEN: ${{ secrets.PEOPLE_HERO_PROXY_TOKEN }}
      PEOPLE_HERO_PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/people-hero/requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install compositor dependencies
        run: python -m pip install --requirement tools/people-hero/requirements.txt

      - name: Validate repository and generator
        run: npm test

      - name: Confirm runtime configuration
        env:
          REQUESTED_PERSON_ID: ${{ inputs.person_id }}
        run: npm run people-hero:preflight -- --person-id "$REQUESTED_PERSON_ID"

      - name: Stage candidate
        env:
          REQUESTED_PERSON_ID: ${{ inputs.person_id }}
        run: npm run people-hero:stage -- --person-id "$REQUESTED_PERSON_ID"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: people-hero-candidate-${{ github.run_id }}
          path: tools/people-hero/.work/attempt-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
